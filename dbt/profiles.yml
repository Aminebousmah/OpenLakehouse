openlakehouse:
  target: trino
  outputs:
    trino:
      type: trino
      method: none
      user: engineer
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: 8080
      catalog: iceberg
      schema: staging
      threads: 2
    # CI and local checks without Docker: the same models on DuckDB, over a small fixture.
    ci:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'target/ci.duckdb') }}"
      schema: staging
      threads: 2
